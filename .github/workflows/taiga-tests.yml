name: Taiga Automated Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Project Structure
        run: |
          pwd
          ls -la
          ls -la tiaga-testing

      - name: Run Maven Tests
        working-directory: ./tiaga-testing
        run: mvn test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: tiaga-testing/target/surefire-reports/

